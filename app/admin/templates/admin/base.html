<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}Dynamic Audio Creative{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        .sidebar { min-height: 100vh; background: #1a1a2e; }
        .sidebar a { color: #ccc; text-decoration: none; padding: 0.5rem 1rem; display: block; border-radius: 4px; }
        .sidebar a:hover, .sidebar a.active { color: #fff; background: #16213e; }
        .sidebar h6 { color: #888; font-size: 0.75rem; text-transform: uppercase; letter-spacing: 0.05em; }
        .badge-status-complete { background: #198754; }
        .badge-status-failed { background: #dc3545; }
        .badge-status-pending { background: #6c757d; }
        .badge-status-running { background: #0d6efd; }
    </style>
</head>
<body>
<div class="container-fluid">
    <div class="row">
        <!-- Sidebar -->
        <nav class="col-md-2 sidebar p-3">
            <h5 class="text-white mb-4">DAC Admin</h5>
            <h6 class="mt-3">Manage</h6>
            <a href="{{ url_for('admin.dashboard') }}" class="{% if request.endpoint == 'admin.dashboard' %}active{% endif %}">Dashboard</a>
            <a href="{{ url_for('admin.advertiser_list') }}" class="{% if 'advertiser' in request.endpoint %}active{% endif %}">Advertisers</a>
            <a href="{{ url_for('admin.campaign_list') }}" class="{% if 'campaign' in request.endpoint %}active{% endif %}">Campaigns</a>
            <hr class="border-secondary">
            <a href="{{ url_for('admin.logout') }}" class="text-secondary">Logout</a>
        </nav>

        <!-- Main content -->
        <main class="col-md-10 p-4">
            {% with messages = get_flashed_messages(with_categories=true) %}
            {% if messages %}
                {% for category, message in messages %}
                <div class="alert alert-{{ category }} alert-dismissible fade show" role="alert">
                    {{ message }}
                    <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
                </div>
                {% endfor %}
            {% endif %}
            {% endwith %}

            {% block content %}{% endblock %}
        </main>
    </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
{% block scripts %}{% endblock %}
</body>
</html>
